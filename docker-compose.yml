# The stack of AzeriCard.
#
# Every service builds from a Dockerfile of the repository, so no service
# points at a registry image (R91). The base images of the Dockerfiles are
# pinned by digest.
#
# Every bind mount lives under var/ (R92): the local environment file, the
# data of the database and the state of the application. The source is baked
# into the images, so no versioned directory is mounted into a container.
# Named volumes are forbidden.
#
# Resource limits and a health check are required for every service (R60, R64,
# R102).
x-resources-default: &resources-default
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
        pids: 256
      reservations:
        cpus: "0.25"
        memory: 128M

services:
  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
    container_name: ac_nginx
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      # The documents of the frontend are built into the image of the node
      # service and shared with the web server.
      - ./var/fe:/var/www/html/fe:ro
    <<: *resources-default
    networks:
      - AzeriCard

  php:
    build:
      context: .
      dockerfile: php.dockerfile
      target: runtime
    container_name: ac_php
    depends_on:
      pgsql:
        condition: service_healthy
    env_file:
      - var/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: "5432"
      L5_SWAGGER_CONST_HOST: ${L5_SWAGGER_CONST_HOST:-http://localhost/api/v1}
    volumes:
      - ./var/storage:/var/www/html/be/storage
    <<: *resources-default
    networks:
      - AzeriCard

  test:
    build:
      context: .
      dockerfile: php.dockerfile
      target: test
    profiles: ["test"]
    # The suite runs against a database in memory, so it needs neither a
    # database nor the network. It reads no environment file, so the values of
    # the local machine cannot change the result.
    <<: *resources-default
    networks:
      - AzeriCard

  composer:
    build:
      context: .
      dockerfile: composer.dockerfile
    container_name: ac_composer
    working_dir: /var/www/html/be
    volumes:
      - ./src/be:/var/www/html/be
    environment:
      L5_SWAGGER_CONST_HOST: ${L5_SWAGGER_CONST_HOST:-http://localhost/api/v1}
    <<: *resources-default
    networks:
      - AzeriCard

  artisan:
    build:
      context: .
      dockerfile: php.dockerfile
      target: runtime
    container_name: ac_artisan
    working_dir: /var/www/html/be
    entrypoint: ["php", "artisan"]
    env_file:
      - var/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: "5432"
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - ./var/storage:/var/www/html/be/storage
    <<: *resources-default
    networks:
      - AzeriCard

  pgsql:
    build:
      context: .
      dockerfile: postgres.dockerfile
    container_name: ac_pgsql
    restart: always
    shm_size: 128mb
    ports:
      - "${DB_PORT:-6432}:5432"
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required, copy .env.example to var/.env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required, copy .env.example to var/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to var/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d ${DB_DATABASE:?DB_DATABASE is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *resources-default
    networks:
      - AzeriCard

  mongodb:
    build:
      context: .
      dockerfile: mongo.dockerfile
    container_name: ac_mongodb
    restart: always
    ports:
      - "${MONGO_PORT:-37017}:27017"
    volumes:
      - ./var/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:?DB_USERNAME is required, copy .env.example to var/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to var/.env}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *resources-default
    networks:
      - AzeriCard

  node:
    build:
      context: .
      dockerfile: node.dockerfile
      target: build
    container_name: ac_node
    working_dir: /var/www/html/fe
    volumes:
      # The source of the frontend is in the image, like the source of the
      # application. A mount of the source would hide the node_modules of the
      # image, and the build would end with "vite: not found".
      - ./var/fe:/var/www/html/fe/dist
    <<: *resources-default
    networks:
      - AzeriCard

networks:
  AzeriCard:
    name: AzeriCard
